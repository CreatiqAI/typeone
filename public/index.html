    .flight-line {
      stroke-dasharray: 4 4;
      animation: dashMove 1.2s linear infinite;

    let state = {
      cms: null,
      selectedBrand: 'All',
      selectedPhase: 'All',
      selectedPartType: 'All',
      searchQuery: '',
      activePhaseTab: 0,
      modalProduct: null,
      activeFormTab: 'inquiry',
      inquiryType: 'Dealer Application',
      toastMessage: null,
      exportViewMode: '3d-globe',
      selectedExportId: 'exp-my',
      autoRotateGlobe: true,
      activeMaterialIndex: 0,
      activeProcessLine: 'strut',
      activeProcessStep: 0,
      processAutoPlay: false,
      // Realistic Hero Showcase State
      heroMode: 'underbody', // 'underbody' | 'factory'
      activeInstallIndex: 0,
      activeHeroFactoryStep: 1
    };

    let globeInstance = null;
    let processAutoTimer = null;

    async function loadCMS() {
      const res = await fetch('/api/cms', { cache: 'no-store' });
      state.cms = await res.json();
      if (state.cms.globalExports?.length) {
        state.selectedExportId = state.cms.globalExports[0].id;
      }
      render();
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getFilteredProducts() {
      if (!state.cms) return [];
      return state.cms.products.filter((item) => {
        const matchBrand = state.selectedBrand === 'All' || item.brand.toLowerCase() === state.selectedBrand.toLowerCase();
        const matchPhase = state.selectedPhase === 'All' || item.phase === state.selectedPhase;
        const matchPart = state.selectedPartType === 'All' || item.partType.toLowerCase().includes(state.selectedPartType.toLowerCase());
        const q = state.searchQuery.trim().toLowerCase();
        const matchQuery = !q ||
          item.name.toLowerCase().includes(q) ||
          item.carModel.toLowerCase().includes(q) ||
          item.sku.toLowerCase().includes(q) ||
          item.brand.toLowerCase().includes(q) ||
          item.partType.toLowerCase().includes(q);
        return matchBrand && matchPhase && matchPart && matchQuery;
      });
    }

      state.heroMode = mode;
      const root = document.getElementById('hero-realistic-stage');
      if (root) root.innerHTML = buildHeroRealisticStageHtml();
    };

      state.activeInstallIndex = idx;
      const root = document.getElementById('hero-realistic-stage');
      if (root) root.innerHTML = buildHeroRealisticStageHtml();

      if (root) root.innerHTML = buildHeroRealisticStageHtml();

                onclick="setHeroMode('factory')"

                    class="w-full h-64 object-contain"

                            ? 'bg-[#ED1C24] text-white border-white scale-125 z-20'

                      >

      const card = document.getElementById('map-3d-stage');

      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `rotateX(${(-y * 12 + 6).toFixed(2)}deg) rotateY(${(x * 14).toFixed(2)}deg)`;
    };

        y: Math.max(10, Math.min(90, y))

    function init3DGlobe() {
      if (state.exportViewMode !== '3d-globe') return;
      const container = document.getElementById('typeone-3d-globe');
      if (!container || typeof Globe === 'undefined') return;

      const list = state.cms?.globalExports || [];
      const hq = list.find(c => c.isHQ) || { lat: 3.139, lng: 101.6869, country: 'Malaysia' };

      const arcsData = list
        .filter(c => !c.isHQ)
        .map((dest) => ({
          startLat: hq.lat,
          startLng: hq.lng,
          endLat: dest.lat,
          endLng: dest.lng,
          color: ['#0018FF', '#ED1C24']
        }));

      const ringsData = list.map(c => ({
        lat: c.lat,
        lng: c.lng,
        maxR: c.isHQ ? 6 : 3.5,
        propagationSpeed: 2,
        repeatPeriod: 900,
        color: c.isHQ ? '#ED1C24' : '#3B82F6'
      }));

      const width = container.clientWidth || 680;
      const height = 500;

      globeInstance = Globe()(container)
        .width(width)
        .height(height)
        .backgroundColor('rgba(0,0,0,0)')
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
        .showAtmosphere(true)
        .atmosphereColor('#1D4ED8')
        .atmosphereAltitude(0.16)
        .arcsData(arcsData)
        .arcColor('color')
        .arcDashLength(0.5)
        .arcDashGap(0.25)
        .arcDashAnimateTime(2000)
        .arcStroke(0.75)
        .arcAltitudeAutoScale(0.35)
        .ringsData(ringsData)
        .ringColor(d => d.color)
        .ringMaxRadius('maxR')
        .ringPropagationSpeed('propagationSpeed')
        .ringRepeatPeriod('repeatPeriod')
        .htmlElementsData(list)
        .htmlLat(d => d.lat)
        .htmlLng(d => d.lng)
        .htmlAltitude(d => (d.isHQ ? 0.03 : 0.015))
        .htmlElement(d => {
          const el = document.createElement('div');
          el.style.pointerEvents = 'auto';
          el.style.cursor = 'pointer';
          el.innerHTML = `
            <div title="${escapeHtml(d.country)}" class="flex flex-col items-center -translate-x-1/2 -translate-y-full select-none">
              <div class="px-2 py-0.5 rounded text-[10px] font-mono font-semibold shadow-md border ${
                d.isHQ
                  ? 'bg-[#ED1C24] text-white border-white'
                  : 'bg-slate-950/90 text-white border-slate-600 hover:border-white'
              }">
                ${escapeHtml(d.iso)}
              </div>
              <div class="w-1.5 h-1.5 rotate-45 -mt-0.5 ${d.isHQ ? 'bg-[#ED1C24]' : 'bg-white'}"></div>
            </div>
          `;
          el.onclick = () => window.selectExportCountry(d.id);
          return el;
        });

      globeInstance.pointOfView({ lat: 14.0, lng: 95.0, altitude: 1.85 }, 0);
      const controls = globeInstance.controls();
      if (controls) {

                          <span class="truncate">${escapeHtml(c.country.replace(' (Global HQ)', ''))}</span>
                          <span class="font-mono text-[10px] opacity-75 ml-1">${escapeHtml(c.iso)}</span>
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 3-PHASE CHASSIS ENGINEERING SYSTEM -->
        <section id="three-phase" class="py-20 bg-slate-50 border-b border-slate-200">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="max-w-3xl mb-12">
              <div class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-2">CHASSIS TUNING ARCHITECTURE</div>
              <h2 class="text-3xl sm:text-4xl font-bold text-slate-950 font-heading">${escapeHtml(siteConfig.engineering.headline)}</h2>
              <p class="text-slate-600 mt-2 text-base">${escapeHtml(siteConfig.engineering.subheadline)}</p>
            </div>

            <div class="grid md:grid-cols-3 gap-4 mb-8">
              ${phases.map((p, idx) => `
                <button type="button" onclick="setPhaseTab(${idx})" class="text-left p-6 rounded-xl border transition-colors cursor-pointer ${
                  state.activePhaseTab === idx
                    ? 'bg-white border-slate-950 shadow-sm'
                    : 'bg-slate-100/70 border-slate-200 hover:bg-white'
                }">
                  <div class="flex items-center justify-between text-xs font-mono mb-2">
                    <span class="${state.activePhaseTab === idx ? 'text-[#0018FF] font-bold' : 'text-slate-500'}">${escapeHtml(p.phaseNumber)}</span>
                    <span class="text-slate-500">Rigidity Index ${escapeHtml(p.rigidityScore)}%</span>
                  </div>
                  <h3 class="text-lg font-bold text-slate-950 font-heading">${escapeHtml(p.title)}</h3>
                  <p class="text-xs text-slate-500 mt-1">${escapeHtml(p.subtitle)}</p>
                </button>
              `).join('')}
            </div>

            <div class="rounded-xl bg-white border border-slate-200 p-8 sm:p-10 grid lg:grid-cols-12 gap-8 items-center">
              <div class="lg:col-span-7 space-y-5">
                <div class="text-xs font-mono text-[#0018FF] font-semibold uppercase">${escapeHtml(activePhase.phaseNumber)}</div>
                <h3 class="text-2xl font-bold text-slate-950 font-heading">${escapeHtml(activePhase.title)} — ${escapeHtml(activePhase.subtitle)}</h3>
                <p class="text-slate-600 text-sm sm:text-base leading-relaxed">${escapeHtml(activePhase.description)}</p>
                <ul class="space-y-2 pt-2">
                  ${activePhase.benefits.map(b => `
                    <li class="flex items-start gap-2.5 text-sm text-slate-800">
                      <span class="text-[#0018FF] font-bold">•</span>
                      <span>${escapeHtml(b)}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
              <div class="lg:col-span-5">
                <div class="rounded-lg bg-slate-950 p-6 flex flex-col items-center">
                  <img src="${escapeHtml(activePhase.diagramImage)}" alt="${escapeHtml(activePhase.title)}" class="w-full h-56 object-contain" />
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- MANUFACTURED VEHICLE APPLICATION SERIES (SHOWCASE ONLY — NO RESELLING) -->
        <section id="catalog" class="py-20 bg-white border-b border-slate-200">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
              <div>
                <div class="text-xs font-mono uppercase tracking-widest text-slate-500 mb-2">MANUFACTURED PRODUCT LINEUP</div>
                <h2 class="text-3xl sm:text-4xl font-bold text-slate-950 font-heading">Engineered Vehicle Application Series</h2>
              </div>
              <div class="w-full md:w-80">
                <input id="catalog-search-input" type="text" value="${escapeHtml(state.searchQuery)}" oninput="setSearchQuery(this.value)" placeholder="Filter by vehicle model or code..." class="w-full px-4 py-2.5 rounded-lg bg-slate-50 border border-slate-300 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-[#0018FF]" />
              </div>
            </div>

            <div class="flex flex-wrap gap-2 mb-6">
              ${allBrands.map(b => {
                const active = state.selectedBrand.toLowerCase() === b.toLowerCase();
                return `
                  <button type="button" onclick="setBrandFilter('${escapeHtml(b)}')" class="px-3.5 py-1.5 rounded-lg text-xs font-medium border transition-colors cursor-pointer ${
                    active
                      ? 'bg-slate-950 text-white border-slate-950'
                      : 'bg-white text-slate-700 border-slate-200 hover:border-slate-400'
                  }">
                    ${escapeHtml(b)}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-8 border-b border-slate-200">
              <div class="flex flex-wrap items-center gap-3">
                <select onchange="setPartFilter(this.value)" class="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 cursor-pointer">
                  ${allParts.map(pt => `<option value="${escapeHtml(pt)}" ${state.selectedPartType === pt ? 'selected' : ''}>Bar Type: ${escapeHtml(pt)}</option>`).join('')}
                </select>
                <select onchange="setPhaseFilter(this.value)" class="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 cursor-pointer">
                  <option value="All" ${state.selectedPhase === 'All' ? 'selected' : ''}>Architecture: All Phases</option>
                  <option value="Phase 1: Comfort" ${state.selectedPhase === 'Phase 1: Comfort' ? 'selected' : ''}>Phase 1: Comfort</option>
                  <option value="Phase 2: Stability" ${state.selectedPhase === 'Phase 2: Stability' ? 'selected' : ''}>Phase 2: Stability</option>
                  <option value="Phase 3: Performance" ${state.selectedPhase === 'Phase 3: Performance' ? 'selected' : ''}>Phase 3: Performance</option>
                </select>
                <button type="button" onclick="resetFilters()" class="text-xs text-slate-500 hover:text-slate-900 underline cursor-pointer">Reset</button>
              </div>
              <span id="catalog-count" class="text-xs font-mono text-slate-500">${filtered.length} engineered components</span>
            </div>

            <div id="catalog-grid">
              ${buildProductGridHtml(filtered)}
            </div>
          </div>
        </section>

        <!-- CORPORATE CONTACT, DISTRIBUTOR PARTNERSHIP & WARRANTY REGISTRATION -->
        <section id="contact" class="py-20 bg-slate-50 border-b border-slate-200">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 space-y-6">
              <div class="text-xs font-mono uppercase tracking-widest text-slate-500">CORPORATE HEADQUARTERS</div>
              <h2 class="text-3xl font-bold text-slate-950 font-heading">Distributor Partnerships & Warranty Verification</h2>
              <p class="text-slate-600 text-sm leading-relaxed">
                Connect with TYPE ONE manufacturing headquarters in Kuala Lumpur for regional dealer/distributor applications, technical R&D inquiries, or official Lifetime Structural Warranty registration.
              </p>
              <div class="space-y-4 pt-2 text-sm">
                <div class="p-4 rounded-xl bg-white border border-slate-200">
                  <div class="text-xs text-slate-400 uppercase font-mono">Manufacturing Plant & HQ</div>
                  <div class="font-medium text-slate-900 mt-1">${escapeHtml(siteConfig.contact.address)}</div>
                </div>
                <div class="p-4 rounded-xl bg-white border border-slate-200">
                  <div class="text-xs text-slate-400 uppercase font-mono">Corporate Telephone & Email</div>
                  <div class="font-medium text-slate-900 mt-1">${escapeHtml(siteConfig.contact.phoneOffice)} / ${escapeHtml(siteConfig.contact.phoneMobile)}</div>
                  <div class="text-xs text-slate-500 mt-0.5">${escapeHtml(siteConfig.contact.email)}</div>
                </div>
                <div class="p-4 rounded-xl bg-white border border-slate-200">
                  <div class="text-xs text-slate-400 uppercase font-mono">Factory Operating Hours</div>
                  <div class="text-slate-900 mt-1">${escapeHtml(siteConfig.contact.hoursWeekday)}</div>
                  <div class="text-xs text-slate-500">${escapeHtml(siteConfig.contact.hoursSaturday)} (${escapeHtml(siteConfig.contact.hoursSunday)})</div>
                </div>
              </div>
            </div>

            <div class="lg:col-span-7">
              <div class="rounded-xl bg-white border border-slate-200 p-6 sm:p-8">
                <div class="grid grid-cols-2 gap-2 p-1 rounded-lg bg-slate-100 mb-6">
                  <button type="button" onclick="switchPortalTab('inquiry')" class="py-2 px-4 rounded-md text-xs sm:text-sm font-semibold transition-colors cursor-pointer ${state.activeFormTab === 'inquiry' ? 'bg-white text-slate-950 shadow-sm' : 'text-slate-600 hover:text-slate-950'}">
                    Distributor & Technical Inquiry
                  </button>
                  <button type="button" onclick="switchPortalTab('warranty')" class="py-2 px-4 rounded-md text-xs sm:text-sm font-semibold transition-colors cursor-pointer ${state.activeFormTab === 'warranty' ? 'bg-white text-slate-950 shadow-sm' : 'text-slate-600 hover:text-slate-950'}">
                    Warranty Registration
                  </button>
                </div>

                ${state.toastMessage ? `
                  <div class="mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm">
                    ${escapeHtml(state.toastMessage)}
                  </div>
                ` : ''}

                ${state.activeFormTab === 'inquiry' ? `
                  <form onsubmit="submitInquiryForm(event)" class="space-y-4">
                    <div class="grid sm:grid-cols-3 gap-2">
                      ${['Dealer Application', 'Vehicle Fitment Inquiry', 'General Support'].map(t => `
                        <button type="button" onclick="switchPortalTab('inquiry', '${t}')" class="py-2 px-3 rounded-lg text-xs font-medium border text-center cursor-pointer ${state.inquiryType === t ? 'bg-slate-950 text-white border-slate-950' : 'bg-white border-slate-200 text-slate-600'}">
                          ${t}
                        </button>
                      `).join('')}
                    </div>
                    <div class="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Contact Name *</label>
                        <input required name="name" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Phone / WhatsApp *</label>
                        <input required name="phone" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                    </div>
                    <div class="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Corporate Email *</label>
                        <input required name="email" type="email" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">${state.inquiryType === 'Dealer Application' ? 'Company Name & Country/City *' : 'Vehicle Model / Subject *'}</label>
                        <input required id="inq-vehicle" name="vehicleOrLocation" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Inquiry Message *</label>
                      <textarea required id="inq-message" name="message" rows="3" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 px-5 rounded-lg bg-[#0018FF] hover:bg-blue-700 text-white font-semibold text-sm transition-colors cursor-pointer">
                      Submit to TYPE ONE HQ
                    </button>
                  </form>
                ` : `
                  <form onsubmit="submitWarrantyForm(event)" class="space-y-4">
                    <div class="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Owner Full Name *</label>
                        <input required name="customerName" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Phone Number *</label>
                        <input required name="phone" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                    </div>
                    <div class="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Email *</label>
                        <input required name="email" type="email" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Vehicle Model & Year *</label>
                        <input required name="carModel" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                    </div>
                    <div class="grid sm:grid-cols-3 gap-4">
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Application Code *</label>
                        <input required name="productSku" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Receipt / Serial No. *</label>
                        <input required name="serialOrInvoice" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Install Date *</label>
                        <input required name="installDate" type="date" value="2026-11-16" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Authorized Dealer / Workshop Name *</label>
                      <input required name="dealerName" type="text" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                    </div>
                    <button type="submit" class="w-full py-3 px-5 rounded-lg bg-[#ED1C24] hover:bg-red-700 text-white font-semibold text-sm transition-colors cursor-pointer">
                      Register Official Lifetime Warranty
                    </button>
                  </form>
                `}
              </div>
            </div>
          </div>
        </section>

        <footer class="bg-white py-12 text-slate-500 text-sm">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-4">
              <img src="/assets/typeone-logo.png" alt="TYPE ONE" class="h-8 w-auto object-contain" />
              <div class="text-xs text-slate-500">
                <div class="font-semibold text-slate-900">${escapeHtml(siteConfig.contact.companyLegalName)}</div>
                <div>${escapeHtml(siteConfig.contact.address)}</div>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-6 text-xs font-medium text-slate-600">
              <a href="#engineering" class="hover:text-slate-950">Manufacturing Process</a>
              <a href="#vision-mission" class="hover:text-slate-950">Vision & Mission</a>
              <a href="#global-exports" class="hover:text-slate-950">Global Exports</a>
              <a href="#catalog" class="hover:text-slate-950">Vehicle Applications</a>
              <a href="/admin" class="text-[#0018FF] hover:underline">Admin CMS</a>
            </div>
          </div>
        </footer>

        <!-- Technical Specification Modal (No retail pricing or e-commerce checkout) -->
        ${state.modalProduct ? `
          <div class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeModal()">
            <div class="bg-white border border-slate-200 rounded-xl max-w-xl w-full overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
              <div class="p-6 bg-slate-50 relative flex items-center justify-center h-64 border-b border-slate-200">
                <img src="${escapeHtml(state.modalProduct.image)}" alt="${escapeHtml(state.modalProduct.name)}" class="max-h-52 w-auto object-contain" />
                <button type="button" onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-700 flex items-center justify-center hover:bg-slate-100 cursor-pointer">✕</button>
              </div>
              <div class="p-6 space-y-4">
                <div class="flex flex-wrap items-center gap-2 text-xs font-mono text-slate-600">
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-900">${escapeHtml(state.modalProduct.phase)}</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100">APPLICATION CODE: ${escapeHtml(state.modalProduct.sku)}</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100">${escapeHtml(state.modalProduct.mountingPoints)}-Point OEM Mount</span>
                </div>
                <h3 class="text-xl font-bold text-slate-950 font-heading">${escapeHtml(state.modalProduct.name)}</h3>
                <p class="text-sm text-slate-600 leading-relaxed">
                  <strong>Engineering & Metallurgy:</strong> ${escapeHtml(state.modalProduct.materialSpec)}. Manufactured in Kuala Lumpur under registered Malaysian industrial design for 100% bolt-on installation at factory chassis mounting points.
                </p>
                <div class="flex gap-3 pt-2">
                  <button type="button" onclick="inquireProduct('${escapeHtml(state.modalProduct.id)}')" class="flex-1 py-2.5 px-4 rounded-lg bg-[#0018FF] hover:bg-blue-700 text-white font-semibold text-xs text-center cursor-pointer">
                    Dealer / Technical Inquiry
                  </button>
                  <button type="button" onclick="closeModal()" class="py-2.5 px-4 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold text-xs text-center cursor-pointer">
                    Close
                  </button>
                </div>
              </div>
            </div>
          </div>
        ` : ''}
      `;

      if (state.exportViewMode === '3d-globe') {
        setTimeout(() => init3DGlobe(), 40);
      }
    }

    loadCMS();
  </script>
</body>
</html>
