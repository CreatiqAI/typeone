<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TYPE ONE® — Admin CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            t1blue: '#0018FF',
            t1red: '#ED1C24',
          },
          fontFamily: {
            heading: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="admin-app"></div>

  <script>
    let adminState = {
      authenticated: sessionStorage.getItem('typeone_cms_auth') === 'true',
      loginError: '',
      cms: null,
      activeTab: 'overview',
      productSearch: '',
      showAddModal: false,
      showAddExportModal: false,
      toast: null
    };

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      adminState.toast = msg;
      renderAdmin();
      setTimeout(() => {
        adminState.toast = null;
        renderAdmin();
      }, 3000);
    }

    async function fetchCMS() {
      const res = await fetch('/api/cms', { cache: 'no-store' });
      adminState.cms = await res.json();
      renderAdmin();
    }

    window.handleAdminLogin = (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim().toLowerCase();
      const password = e.target.password.value;
      if (email === 'admin@typeone.com.my' && password === 'typeone2026') {
        adminState.authenticated = true;
        adminState.loginError = '';
        sessionStorage.setItem('typeone_cms_auth', 'true');
        renderAdmin();
      } else {
        adminState.loginError = 'Invalid credentials. Use admin@typeone.com.my / typeone2026';
        renderAdmin();
      }
    };

    window.handleSignOut = () => {
      sessionStorage.removeItem('typeone_cms_auth');
      adminState.authenticated = false;
      renderAdmin();
    };

    window.setAdminTab = (tab) => {
      adminState.activeTab = tab;
      renderAdmin();
    };

    window.openAddSkuModal = () => {
      adminState.showAddModal = true;
      renderAdmin();
    };

    window.closeAddSkuModal = () => {
      adminState.showAddModal = false;
      renderAdmin();
    };

    window.openAddExportModal = () => {
      adminState.showAddExportModal = true;
      renderAdmin();
    };

    window.closeAddExportModal = () => {
      adminState.showAddExportModal = false;
      renderAdmin();
    };

    window.saveCMSChanges = async (msg = 'Changes saved and published.') => {
      const res = await fetch('/api/cms', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(adminState.cms)
      });
      const json = await res.json();
      if (res.ok && json.data) {
        adminState.cms = json.data;
        showToast(msg);
      }
    };

    window.saveBannerQuick = async () => {
      const text = document.getElementById('quick-banner-input').value;
      const show = document.getElementById('quick-banner-check').checked;
      adminState.cms.siteConfig.seo.announcementBanner = text;
      adminState.cms.siteConfig.seo.showAnnouncement = show;
      await window.saveCMSChanges('Announcement bar updated.');
    };

    window.saveVisionMissionForm = async (e) => {
      e.preventDefault();
      const f = e.target;
      if (!adminState.cms.siteConfig.visionMission) {
        adminState.cms.siteConfig.visionMission = {};
      }
      const vm = adminState.cms.siteConfig.visionMission;
      vm.intro = f.intro.value;
      vm.visionTitle = f.visionTitle.value;
      vm.visionText = f.visionText.value;
      vm.missionTitle = f.missionTitle.value;
      vm.missionText = f.missionText.value;
      vm.pillars = [
        f.pillar0.value,
        f.pillar1.value,
        f.pillar2.value,
        f.pillar3.value
      ].filter(Boolean);
      await window.saveCMSChanges('Vision & Mission statements updated.');
    };

    window.submitNewExportCountry = async (e) => {
      e.preventDefault();
      const f = e.target;
      const exportCountry = {
        country: f.country.value,
        flag: '',
        iso: f.iso.value || 'XX',
        region: f.region.value || 'International',
        lat: Number(f.lat.value) || 0,
        lng: Number(f.lng.value) || 0,
        hubCity: f.hubCity.value || f.country.value,
        focusModels: f.focusModels.value || 'Multi-Point Strut & Anti-Roll Bars',
        status: 'Active Export Market'
      };
      const res = await fetch('/api/cms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'add_export_country', exportCountry })
      });
      const json = await res.json();
      if (res.ok && json.data) {
        adminState.cms = json.data;
        adminState.showAddExportModal = false;
        showToast(`Added ${exportCountry.country} to Global Exports.`);
      }
    };

    window.deleteExportCountry = async (id) => {
      adminState.cms.globalExports = (adminState.cms.globalExports || []).filter(c => c.id !== id);
      await window.saveCMSChanges('Removed export market.');
    };

    window.savePagesForm = async (e) => {
      e.preventDefault();
      const f = e.target;
      const sc = adminState.cms.siteConfig;
      sc.hero.badge = f.badge.value;
      sc.hero.titleLine1 = f.titleLine1.value;
      sc.hero.titleHighlight = f.titleHighlight.value;
      sc.hero.subtitle = f.subtitle.value;
      sc.about.headline = f.aboutHeadline.value;
      sc.about.description = f.aboutDescription.value;
      sc.engineering.strutTubeThickness = f.strutSpec.value;
      sc.engineering.antiRollBarThickness = f.arbSpec.value;
      sc.engineering.bracketPlateThickness = f.bracketSpec.value;
      sc.contact.address = f.address.value;
      sc.contact.phoneOffice = f.phoneOffice.value;
      sc.contact.phoneMobile = f.phoneMobile.value;
      sc.contact.email = f.email.value;
      await window.saveCMSChanges('Page content saved.');
    };

    window.savePhasesForm = async (e) => {
      e.preventDefault();
      const f = e.target;
      adminState.cms.phases.forEach((p, idx) => {
        p.title = f[`title_${idx}`].value;
        p.subtitle = f[`subtitle_${idx}`].value;
        p.description = f[`desc_${idx}`].value;
      });
      await window.saveCMSChanges('3-Phase System updated.');
    };

    window.toggleProductStock = async (id, checked) => {
      const prod = adminState.cms.products.find(p => p.id === id);
      if (prod) {
        prod.inStock = checked;
        await window.saveCMSChanges(`Stock updated for ${prod.sku}`);
      }
    };

    window.updateProductName = async (id, newName) => {
      const prod = adminState.cms.products.find(p => p.id === id);
      if (prod && prod.name !== newName) {
        prod.name = newName;
        await window.saveCMSChanges(`Renamed ${prod.sku}`);
      }
    };

    window.deleteProduct = async (id) => {
      const prod = adminState.cms.products.find(p => p.id === id);
      adminState.cms.products = adminState.cms.products.filter(p => p.id !== id);
      await window.saveCMSChanges(`Removed ${prod ? prod.sku : 'product'}.`);
    };

    window.submitNewProduct = async (e) => {
      e.preventDefault();
      const f = e.target;
      const product = {
        name: f.name.value,
        brand: f.brand.value,
        carModel: f.carModel.value,
        partType: f.partType.value,
        sku: f.sku.value,
        phase: f.phase.value,
        mountingPoints: Number(f.mountingPoints.value) || 2,
        materialSpec: f.materialSpec.value,
        image: f.image.value || 'https://typeone.com.my/wp-content/uploads/2026/06/1-Front-Strut-Bar-Jetour-Dashing-22Y-BAR.png',
        inStock: true,
        featured: true
      };
      const res = await fetch('/api/cms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'add_product', product })
      });
      const json = await res.json();
      if (res.ok && json.data) {
        adminState.cms = json.data;
        adminState.showAddModal = false;
        showToast(`Added ${product.sku} to catalog.`);
      }
    };

    window.toggleWarrantyStatus = async (id) => {
      const w = adminState.cms.warranties.find(x => x.id === id);
      if (w) {
        w.status = w.status === 'Verified' ? 'Pending Review' : 'Verified';
        await window.saveCMSChanges(`Warranty #${w.id} marked as ${w.status}`);
      }
    };

    window.updateInquiryStatus = async (id, status) => {
      const inq = adminState.cms.inquiries.find(x => x.id === id);
      if (inq) {
        inq.status = status;
        await window.saveCMSChanges(`Lead #${inq.id} updated to ${status}`);
      }
    };

    window.resetDefaultCMS = async () => {
      if (!confirm('Reset all CMS content and catalog to default TYPE ONE factory data?')) return;
      const res = await fetch('/api/cms', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reset_default' })
      });
      const json = await res.json();
      if (res.ok && json.data) {
        adminState.cms = json.data;
        showToast('CMS restored to default factory data.');
      }
    };

    window.exportBackupJSON = () => {
      const blob = new Blob([JSON.stringify(adminState.cms, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `typeone-cms-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function renderAdmin() {
      const root = document.getElementById('admin-app');
      if (!adminState.authenticated) {
        root.innerHTML = `
          <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
            <div class="max-w-md w-full rounded-xl bg-white border border-slate-200 p-8 shadow-sm space-y-6">
              <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <img src="/assets/typeone-logo.png" alt="TYPE ONE" class="h-8 w-auto object-contain" />
                <span class="text-xs font-mono text-slate-500">CMS LOGIN</span>
              </div>

              <div class="p-3.5 rounded-lg bg-slate-50 border border-slate-200 text-xs text-slate-600 space-y-1">
                <div class="font-semibold text-slate-900">Demo Admin Credentials:</div>
                <div>Email: <code class="text-slate-900">admin@typeone.com.my</code></div>
                <div>Password: <code class="text-slate-900">typeone2026</code></div>
              </div>

              ${adminState.loginError ? `<div class="p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-700">${escapeHtml(adminState.loginError)}</div>` : ''}

              <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Admin Email</label>
                  <input type="email" name="email" required value="admin@typeone.com.my" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                  <input type="password" name="password" required value="typeone2026" class="w-full px-3.5 py-2.5 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-[#0018FF] hover:bg-blue-700 text-white font-semibold text-sm transition-colors cursor-pointer">
                  Sign In
                </button>
              </form>

              <div class="pt-2 text-center">
                <a href="/" class="text-xs text-slate-500 hover:text-slate-900">← Back to Website</a>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (!adminState.cms) {
        root.innerHTML = `<div class="min-h-screen flex items-center justify-center font-mono text-sm text-slate-500">Loading CMS...</div>`;
        return;
      }

      const cms = adminState.cms;
      const globalExports = cms.globalExports || [];
      const vm = cms.siteConfig.visionMission || {
        intro: '',
        visionTitle: 'Vision Statement',
        visionText: '',
        missionTitle: 'Mission Statement',
        missionText: '',
        pillars: ['', '', '', '']
      };
      const q = adminState.productSearch.trim().toLowerCase();
      const filteredProds = cms.products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.carModel.toLowerCase().includes(q));

      root.innerHTML = `
        ${adminState.toast ? `
          <div class="fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-lg bg-slate-950 text-white text-xs font-medium shadow-lg">
            ${escapeHtml(adminState.toast)}
          </div>
        ` : ''}

        <div class="min-h-screen flex flex-col lg:flex-row">
          <!-- Clean White Sidebar -->
          <aside class="w-full lg:w-64 bg-white border-b lg:border-b-0 lg:border-r border-slate-200 p-5 flex flex-col justify-between shrink-0">
            <div class="space-y-6">
              <div class="pb-4 border-b border-slate-100">
                <img src="/assets/typeone-logo.png" alt="TYPE ONE" class="h-8 w-auto object-contain" />
                <div class="text-[11px] font-mono text-slate-400 mt-1.5">CONTENT MANAGEMENT</div>
              </div>

              <nav class="space-y-1">
                ${[
                  { id: 'overview', label: 'Overview' },
                  { id: 'vision_exports', label: `Vision & Exports (${globalExports.length})` },
                  { id: 'products', label: `Products (${cms.products.length})` },
                  { id: 'pages', label: 'Page Copy & Contact' },
                  { id: 'phases', label: '3-Phase System' },
                  { id: 'warranties', label: `Warranties (${cms.warranties.length})` },
                  { id: 'inquiries', label: `Inquiries (${cms.inquiries.length})` }
                ].map(item => `
                  <button type="button" onclick="setAdminTab('${item.id}')" class="w-full text-left px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-colors cursor-pointer ${
                    adminState.activeTab === item.id
                      ? 'bg-[#0018FF] text-white'
                      : 'text-slate-600 hover:bg-slate-100 hover:text-slate-950'
                  }">
                    ${escapeHtml(item.label)}
                  </button>
                `).join('')}
              </nav>
            </div>

            <div class="pt-6 border-t border-slate-200 space-y-2 mt-6">
              <a href="/" class="w-full flex items-center justify-center px-3 py-2 rounded-lg bg-slate-950 hover:bg-slate-800 text-xs font-medium text-white cursor-pointer">
                View Live Website ↗
              </a>
              <button type="button" onclick="exportBackupJSON()" class="w-full px-3 py-2 rounded-lg bg-white hover:bg-slate-50 text-xs font-medium text-slate-700 border border-slate-200 cursor-pointer">
                Export JSON Backup
              </button>
              <button type="button" onclick="handleSignOut()" class="w-full px-3 py-1.5 text-xs text-slate-400 hover:text-red-600 cursor-pointer">
                Sign Out
              </button>
            </div>
          </aside>

          <!-- Main Content -->
          <main class="flex-1 p-6 sm:p-10 overflow-y-auto">
            <div class="flex flex-wrap items-center justify-between gap-4 pb-6 mb-8 border-b border-slate-200">
              <div>
                <h1 class="text-2xl font-bold text-slate-950 font-heading">
                  ${adminState.activeTab === 'overview' ? 'Dashboard Overview' : ''}
                  ${adminState.activeTab === 'vision_exports' ? 'Vision, Mission & Global Exports' : ''}
                  ${adminState.activeTab === 'products' ? 'Product Catalog' : ''}
                  ${adminState.activeTab === 'pages' ? 'Page Copy & Contact Settings' : ''}
                  ${adminState.activeTab === 'phases' ? '3-Phase System' : ''}
                  ${adminState.activeTab === 'warranties' ? 'Warranty Registrations' : ''}
                  ${adminState.activeTab === 'inquiries' ? 'Dealer & Customer Inquiries' : ''}
                </h1>
              </div>
              <div class="flex items-center gap-3">
                <button type="button" onclick="resetDefaultCMS()" class="px-3.5 py-2 rounded-lg bg-white hover:bg-slate-50 border border-slate-200 text-xs font-medium text-slate-700 cursor-pointer">
                  Reset Defaults
                </button>
                <button type="button" onclick="saveCMSChanges()" class="px-4 py-2 rounded-lg bg-[#0018FF] hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold cursor-pointer">
                  Publish Changes
                </button>
              </div>
            </div>

            ${adminState.activeTab === 'overview' ? `
              <div class="space-y-8">
                <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
                  <div class="p-5 rounded-xl bg-white border border-slate-200">
                    <div class="text-xs text-slate-500">Catalog SKUs</div>
                    <div class="text-3xl font-bold text-slate-950 font-heading mt-1">${cms.products.length}</div>
                    <button onclick="setAdminTab('products')" class="text-xs text-[#0018FF] hover:underline mt-3 inline-block cursor-pointer">Manage Products →</button>
                  </div>
                  <div class="p-5 rounded-xl bg-white border border-slate-200">
                    <div class="text-xs text-slate-500">Global Export Markets</div>
                    <div class="text-3xl font-bold text-slate-950 font-heading mt-1">${globalExports.length}</div>
                    <button onclick="setAdminTab('vision_exports')" class="text-xs text-[#0018FF] hover:underline mt-3 inline-block cursor-pointer">Manage Markets →</button>
                  </div>
                  <div class="p-5 rounded-xl bg-white border border-slate-200">
                    <div class="text-xs text-slate-500">Warranty Claims</div>
                    <div class="text-3xl font-bold text-slate-950 font-heading mt-1">${cms.warranties.length}</div>
                    <button onclick="setAdminTab('warranties')" class="text-xs text-[#0018FF] hover:underline mt-3 inline-block cursor-pointer">Review Claims →</button>
                  </div>
                  <div class="p-5 rounded-xl bg-white border border-slate-200">
                    <div class="text-xs text-slate-500">Customer & Dealer Leads</div>
                    <div class="text-3xl font-bold text-slate-950 font-heading mt-1">${cms.inquiries.length}</div>
                    <button onclick="setAdminTab('inquiries')" class="text-xs text-[#0018FF] hover:underline mt-3 inline-block cursor-pointer">Review Leads →</button>
                  </div>
                </div>

                <div class="p-6 rounded-xl bg-white border border-slate-200 space-y-4">
                  <div class="flex items-center justify-between">
                    <div>
                      <h2 class="text-base font-bold text-slate-950 font-heading">Top Announcement Bar</h2>
                      <p class="text-xs text-slate-500">Displayed at the top of the public website</p>
                    </div>
                    <label class="inline-flex items-center gap-2 text-xs font-medium text-slate-700 cursor-pointer">
                      <input id="quick-banner-check" type="checkbox" ${cms.siteConfig.seo.showAnnouncement ? 'checked' : ''} class="accent-[#0018FF]" />
                      <span>Enabled</span>
                    </label>
                  </div>
                  <div class="flex gap-3">
                    <input id="quick-banner-input" type="text" value="${escapeHtml(cms.siteConfig.seo.announcementBanner)}" class="flex-1 px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                    <button type="button" onclick="saveBannerQuick()" class="px-4 py-2 rounded-lg bg-slate-950 hover:bg-slate-800 text-white text-xs font-semibold cursor-pointer">Save</button>
                  </div>
                </div>
              </div>
            ` : ''}

            ${adminState.activeTab === 'vision_exports' ? `
              <div class="space-y-8 max-w-5xl">
                <form onsubmit="saveVisionMissionForm(event)" class="p-6 rounded-xl bg-white border border-slate-200 space-y-4">
                  <h2 class="text-base font-bold text-slate-950 font-heading border-b border-slate-100 pb-3">1. Vision & Mission Statements</h2>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Section Intro</label>
                    <input type="text" name="intro" value="${escapeHtml(vm.intro)}" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div class="grid sm:grid-cols-2 gap-4">
                    <div class="space-y-2">
                      <label class="block text-xs font-semibold text-[#0018FF]">Vision Title</label>
                      <input type="text" name="visionTitle" value="${escapeHtml(vm.visionTitle)}" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      <label class="block text-xs font-medium text-slate-700">Vision Text</label>
                      <textarea name="visionText" rows="3" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900">${escapeHtml(vm.visionText)}</textarea>
                    </div>
                    <div class="space-y-2">
                      <label class="block text-xs font-semibold text-[#ED1C24]">Mission Title</label>
                      <input type="text" name="missionTitle" value="${escapeHtml(vm.missionTitle)}" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                      <label class="block text-xs font-medium text-slate-700">Mission Text</label>
                      <textarea name="missionText" rows="3" class="w-full px-3 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900">${escapeHtml(vm.missionText)}</textarea>
                    </div>
                  </div>
                  <div class="space-y-2">
                    <label class="block text-xs font-medium text-slate-700">Mission Pillars</label>
                    <div class="grid sm:grid-cols-2 gap-3">
                      ${[0, 1, 2, 3].map(idx => `
                        <input type="text" name="pillar${idx}" value="${escapeHtml((vm.pillars || [])[idx] || '')}" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-xs text-slate-900" />
                      `).join('')}
                    </div>
                  </div>
                  <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#0018FF] hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer">
                    Save Vision & Mission
                  </button>
                </form>

                <div class="p-6 rounded-xl bg-white border border-slate-200 space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-3">
                    <div>
                      <h2 class="text-base font-bold text-slate-950 font-heading">2. Global Exports Map Markets (${globalExports.length})</h2>
                      <p class="text-xs text-slate-500">Manage export hubs displayed on the 3D Globe</p>
                    </div>
                    <button type="button" onclick="openAddExportModal()" class="px-3.5 py-2 rounded-lg bg-slate-950 hover:bg-slate-800 text-white text-xs font-semibold cursor-pointer">
                      + Add Export Market
                    </button>
                  </div>

                  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${globalExports.map(c => `

                          <div class="flex flex-wrap items-center gap-2 text-xs font-mono text-slate-500">
                            <span class="font-semibold text-slate-900">${escapeHtml(prod.brand)}</span>
                            <span>•</span>
                            <span>${escapeHtml(prod.sku)}</span>
                            <span>•</span>

                    <textarea name="subtitle" rows="3" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900">${escapeHtml(cms.siteConfig.hero.subtitle)}</textarea>

                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Bracket Spec</label>

                  <div class="grid sm:grid-cols-3 gap-4">
                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Office Phone</label>

                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Mobile / WhatsApp</label>

                    <div class="grid sm:grid-cols-2 gap-4">

                      <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Subtitle</label>
                        <input type="text" name="subtitle_${idx}" value="${escapeHtml(p.subtitle)}" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />

                    <div>
                      <label class="block text-xs font-medium text-slate-700 mb-1">Description</label>

                        <span class="text-[11px] font-medium px-2 py-0.5 rounded ${w.status === 'Verified' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">${escapeHtml(w.status)}</span>

                      <div class="text-xs text-slate-600">Vehicle: <strong>${escapeHtml(w.carModel)}</strong> • SKU: <code>${escapeHtml(w.productSku)}</code> • Receipt: <code>${escapeHtml(w.serialOrInvoice)}</code></div>

                  </div>

              </div>
            ` : ''}

                    <div class="space-y-1 max-w-2xl">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-800">${escapeHtml(inq.type)}</span>
                        <span class="font-bold text-slate-950">${escapeHtml(inq.name)}</span>
                        <span class="text-xs text-slate-500">(${escapeHtml(inq.vehicleOrLocation)})</span>

                      <p class="text-sm text-slate-700">${escapeHtml(inq.message)}</p>
                      <div class="text-xs text-slate-400">${escapeHtml(inq.phone)} • ${escapeHtml(inq.email)}</div>

                    <select onchange="updateInquiryStatus('${escapeHtml(inq.id)}', this.value)" class="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-medium text-slate-800 cursor-pointer">

                      <option value="Partner Approved" ${inq.status === 'Partner Approved' ? 'selected' : ''}>Partner Approved</option>
                    </select>
                  </div>
                `).join('')}
              </div>
            ` : ''}

        </div>

        <!-- Modal: Add Product SKU -->
        ${adminState.showAddModal ? `
          <div class="fixed inset-0 z-50 bg-slate-950/50 flex items-center justify-center p-4">
            <div class="bg-white border border-slate-200 rounded-xl max-w-lg w-full p-6 space-y-4">
              <h3 class="text-lg font-bold text-slate-950 font-heading">Add New Product SKU</h3>
              <form onsubmit="submitNewProduct(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Product Title *</label>
                  <input required name="name" type="text" placeholder="Front Strut Bar — BYD Seal 24Y" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Make *</label>
                    <input required name="brand" type="text" value="Honda" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Model & Year *</label>
                    <input required name="carModel" type="text" placeholder="Civic FL5 23Y" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Component Type *</label>
                    <input required name="partType" type="text" value="Front Strut Bar" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">SKU Code *</label>
                    <input required name="sku" type="text" placeholder="HCFL5-FS2-00999" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Phase</label>
                    <select name="phase" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900">
                      <option value="Phase 1: Comfort">Phase 1: Comfort</option>
                      <option value="Phase 2: Stability">Phase 2: Stability</option>
                      <option value="Phase 3: Performance">Phase 3: Performance</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Points</label>
                    <input name="mountingPoints" type="number" value="2" min="2" max="8" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Material Spec</label>
                  <input name="materialSpec" type="text" value="1.6mm Oval Steel Tube + 4.5mm Brackets" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Image URL</label>
                  <input name="image" type="text" value="https://typeone.com.my/wp-content/uploads/2026/06/1-Front-Strut-Bar-Jetour-Dashing-22Y-BAR.png" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                </div>
                <div class="flex justify-end gap-2 pt-3">
                  <button type="button" onclick="closeAddSkuModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium cursor-pointer">Cancel</button>
                  <button type="submit" class="px-4 py-2 rounded-lg bg-[#0018FF] text-white text-xs font-semibold cursor-pointer">Save SKU</button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}

        <!-- Modal: Add Export Market -->
        ${adminState.showAddExportModal ? `
          <div class="fixed inset-0 z-50 bg-slate-950/50 flex items-center justify-center p-4">

              <form onsubmit="submitNewExportCountry(event)" class="space-y-3">

                  <div class="col-span-2">
                    <label class="block text-xs font-medium text-slate-700 mb-1">Country Name *</label>
                    <input required name="country" type="text" placeholder="Australia" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">ISO Code *</label>
                    <input required name="iso" type="text" placeholder="AU" maxlength="3" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Region *</label>
                    <input required name="region" type="text" placeholder="Oceania" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Latitude *</label>
                    <input required name="lat" type="number" step="any" placeholder="-33.86" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Longitude *</label>
                    <input required name="lng" type="number" step="any" placeholder="151.20" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-700 mb-1">Hub City *</label>
                  <input required name="hubCity" type="text" placeholder="Sydney & Melbourne" class="w-full px-3.5 py-2 rounded-lg bg-white border border-slate-300 text-sm text-slate-900" />

                <div class="flex justify-end gap-2 pt-3">
                  <button type="button" onclick="closeAddExportModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-xs font-medium cursor-pointer">Cancel</button>
                  <button type="submit" class="px-4 py-2 rounded-lg bg-[#0018FF] text-white text-xs font-semibold cursor-pointer">Add Market</button>
                </div>
              </form>
            </div>
